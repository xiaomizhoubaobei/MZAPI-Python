---
name: Bug 报告
description: 报告 Bug 或问题
title: "[Bug] "
labels:
  - bug/修复
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢您提交 Bug 报告！请尽可能详细地填写以下信息，这将帮助我们更快地定位和解决问题。

        ---
        **在提交之前，请确认：**
        - [ ] 我已搜索现有的 Issues，确认这是一个新的问题
        - [ ] 我已尝试使用最新版本的 MZAPI SDK
        - [ ] 我已阅读相关文档

  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 简要描述您遇到的 Bug
      placeholder: 例如：调用 OCR 接口时出现超时错误
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: 复现步骤
      description: 请提供能够复现问题的详细步骤
      placeholder: |
        1. 安装 MZAPI SDK: pip install mzapi-multicloud-sdk
        2. 创建配置文件
        3. 运行以下代码:
        4. 观察到的错误
    validations:
      required: true

  - type: textarea
    id: code-example
    attributes:
      label: 复现代码
      description: 提供能够重现问题的最小代码示例
      placeholder: |
        ```python
        from mzapi import GeneralBasicOCR

        # 在这里粘贴您的代码
        ```
      render: python
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: 预期行为
      description: 描述您期望发生什么
      placeholder: 例如：应该成功返回 OCR 识别结果
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: 实际行为
      description: 描述实际发生了什么
      placeholder: 例如：抛出 TimeoutError 异常
    validations:
      required: true

  - type: textarea
    id: error-message
    attributes:
      label: 错误信息
      description: 请粘贴完整的错误堆栈信息
      placeholder: |
        Traceback (most recent call last):
          File "example.py", line 10, in <module>
          ...
      render: text
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 请提供运行环境信息
      placeholder: |
        - 操作系统: 例如 Ubuntu 20.04, Windows 10, macOS 12
        - Python 版本: 例如 3.10.0, 3.11.5
        - MZAPI SDK 版本: 例如 0.0.1
        - 安装方式: pip install mzapi-multicloud-sdk
        - 使用的服务: 例如 腾讯云 OCR, 华为云 OBS
      render: yaml
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: 配置信息（已脱敏）
      description: 请提供相关配置（请隐藏敏感信息如密钥、Token 等）
      placeholder: |
        ```python
        config = {
            "secret_id": "AKIDxxxxxxxx",
            "secret_key": "xxxxxxxx",  # 请隐藏完整密钥
            "region": "ap-guangzhou"
        }
        ```
      render: python
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志信息
      description: 如有相关日志，请粘贴在此处
      render: text
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: 截图
      description: 如有必要，请添加截图或录屏来说明问题
    validations:
      required: false

  - type: textarea
    id: additional-info
    attributes:
      label: 附加信息
      description: 其他任何有助于解决问题的信息
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认事项
      options:
        - label: 我已确认这个问题不是由我的代码引起的
          required: false
        - label: 我已在本地环境中重现了这个问题
          required: false
        - label: 我已阅读并同意遵守行为准则
          required: true
