# MZAPI Python SDK 标签配置文件
# 为不同类型的文件更改添加相应的标签

# ===== 文件类型标签 =====

# 文档相关
'documentation/文档':
  - 'docs/**/*'
  - '**/*.md'
  - '**/*.rst'
  - '**/README*'
  - '**/CHANGELOG*'
  - '**/LICENSE*'
  - '**/CONTRIBUTING*'
  - '**/NOTICE*'
  - '**/docs/images/**/*'
  - '**/docs/assets/**/*'

# 核心 Python 代码
'core/核心代码':
  - '**/*.py'
  - '!tests/**/*'
  - '!examples/**/*'
  - '!docs/**/*'
  - '!scripts/**/*'
  - '!benchmarks/**/*'
  - '!tools/**/*'

# 测试代码
'tests/测试':
  - 'tests/**/*'
  - '**/*_test.py'
  - '**/test_*.py'
  - '**/test-*.py'
  - '**/conftest.py'
  - '**/pytest*.py'
  - '**/mock*.py'
  - '**/fixtures/**/*'
  - '**/unittest/**/*'

# 示例代码
'examples/示例':
  - 'examples/**/*'
  - 'samples/**/*'
  - 'demo/**/*'

# 依赖管理
'dependencies/依赖':
  - 'requirements*.txt'
  - 'setup.py'
  - 'setup.cfg'
  - 'pyproject.toml'
  - 'poetry.lock'
  - 'Pipfile'
  - 'Pipfile.lock'
  - 'environment.yml'

# CI/CD 配置
'ci/持续集成':
  - '.github/**/*'
  - '.travis.yml'
  - '.gitlab-ci.yml'
  - '.circleci/**/*'
  - 'tox.ini'
  - '.flake8'
  - 'pytest.ini'
  - '.coveragerc'
  - 'codecov.yml'

# 配置文件
'config/配置':
  - '**/*.ini'
  - '**/*.cfg'
  - '**/*.conf'
  - '**/*.config'
  - '**/*.yaml'
  - '**/*.yml'
  - '**/*.toml'
  - '**/*.properties'
  - '**/*.env'
  - '.env*'
  - 'config/**/*'

