name: 发布包到PyPI

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'

permissions:
  contents: read
  id-token: write

jobs:
  release-build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e3f713f2d8f53843e71c69a996d56f51aa9adfb9 # v2.14.1
      with:
        egress-policy: audit

    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4.3.1

    - name: 设置Python环境
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: 构建发布分发包
      run: |
        python -m pip install build
        python -m build

    - name: 上传分发包作为工件
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: release-dists-${{ matrix.os }}-${{ matrix.python-version }}
        path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs: release-build

    environment:
      name: pypi
      url: https://pypi.org/project/MZAPI

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e3f713f2d8f53843e71c69a996d56f51aa9adfb9 # v2.14.1
      with:
        egress-policy: audit

    - name: 检索所有发布分发包
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        path: all-dists/

    - name: 合并所有分发包到 dist 目录
      run: |
        mkdir -p dist
        find all-dists -name "*.whl" -exec cp {} dist/ \;
        find all-dists -name "*.tar.gz" -exec cp {} dist/ \;

    - name: 提取版本号
      id: extract_version
      run: |
        filename=$(ls dist/mzapi_python-*.whl | head -1)
        version=$(echo $filename | sed -e 's/.*-\([0-9]*\.[0-9]*\.[0-9]*\)-py3-none-any\.whl/\1/')
        echo "version=$version" >> $GITHUB_ENV

    - name: 将发布分发包发布到PyPI
      uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1
      with:
        packages-dir: dist/

    - name: Generate CI Evidence Pack
      if: always()
      uses: OrygnsCode/ci-evidence-pack@main
      with:
        upload-name: evidence-bundle-v${{ env.version }}
        sign: 'true'
        include: |
          dist/
        retention-days: 90

    - name: Create GitHub release
      uses: step-security/action-gh-release@d45511d7589f080cf54961ff056b9705a74fd160 # v2.5.0
      with:
          tag_name: v${{ env.version }}
          name: Release v${{ env.version }}
          body: |
            🎉 发布新版本${{ env.version }} 🎉

            这是我们新版本${{ env.version }}的发布说明。本次发布包含了以下更改：

            ${{ github.event.head_commit.message }}！
          files: |
            dist/*.whl
            dist/*.tar.gz
          token: ${{ secrets.TOKEN }}