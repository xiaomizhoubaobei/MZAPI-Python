name: 发布包到PyPI

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: audit

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 2

    - name: 检查版本号是否变更
      id: check
      run: |
        set -e

        echo "🔍 检查 pyproject.toml 中版本号是否发生变更..."

        # 提取当前版本号（兼容 version = "x" 与 version="x" 两种写法，并剥离两侧引号）
        current_version=$(grep -E '^[[:space:]]*version[[:space:]]*=' pyproject.toml | head -1 | sed -E 's/.*=[[:space:]]*[\"'\'']?([^\"'\'']+)[\"'\'']?.*/\1/' | tr -d '[:space:]')
        echo "当前版本号: $current_version"

        # 提取上一次提交中的版本号（首次提交时 git show HEAD~1 会失败，此时 prev_version 为空）
        prev_version=$(git show HEAD~1:pyproject.toml 2>/dev/null | grep -E '^[[:space:]]*version[[:space:]]*=' | head -1 | sed -E 's/.*=[[:space:]]*[\"'\'']?([^\"'\'']+)[\"'\'']?.*/\1/' | tr -d '[:space:]') || true
        echo "上一次版本号: $prev_version"

        # 判断版本号是否发生变更：上次提交版本为空(首次) 或 与当前不同
        if [ -n "$prev_version" ] && [ "$current_version" != "$prev_version" ]; then
          echo "✅ 版本号已变更: $prev_version -> $current_version"
          echo "version_changed=true" >> $GITHUB_OUTPUT
          echo "version=$current_version" >> $GITHUB_OUTPUT
          exit 0
        fi

        # 版本号未变更（或首次提交），进一步检查 PyPI 上是否已存在该版本
        # 若 PyPI 上不存在该版本，说明是首次发布/发布被跳过，应触发发布
        echo "ℹ️ 版本号未变更（$current_version），检查 PyPI 上是否已发布..."
        pypi_http_code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/mzapi-multicloud-sdk/$current_version/json" || true)
        echo "PyPI 查询该版本的 HTTP 状态码: $pypi_http_code"

        if [ "$pypi_http_code" = "200" ]; then
          echo "✅ 该版本（$current_version）已在 PyPI 上存在，跳过发布"
          echo "version_changed=false" >> $GITHUB_OUTPUT
        else
          echo "🚀 该版本（$current_version）尚未发布到 PyPI，触发发布"
          echo "version_changed=true" >> $GITHUB_OUTPUT
          echo "version=$current_version" >> $GITHUB_OUTPUT
        fi

  release-build:
    # 注意：该包是纯 Python 实现，构建出的 wheel 为通用标签 py3-none-any（平台无关、版本无关），
    # 因此无需在多个 OS / Python 版本的矩阵中分别构建。
    # 若保留矩阵，多个 job 会产出完全同名的 mzapi_multicloud_sdk-<版本>-py3-none-any.whl，
    # 在 pypi-publish 阶段用 merge-multiple 合并工件时同名文件会被并发覆盖而损坏，
    # 导致 twine check 报 “BadZipFile: 中央目录的错误魔术数字”。这里改为单一构建即可根治。
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: audit

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: 设置Python环境
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    - name: 构建发布分发包
      run: |
        python -m pip install build
        python -m build

    - name: 上传分发包作为工件
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: release-dists
        path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs: release-build

    # 该 job 需要创建 GitHub release，因此必须将 contents 权限提升为 write。
    # 顶层 permissions 声明为 contents: read，会限制整个工作流的 GITHUB_TOKEN；
    # 这里单独为 pypi-publish job 提升权限，即可让 step-security/action-gh-release 创建 release。
    permissions:
      contents: write

    environment:
      name: pypi
      url: https://pypi.org/project/mzapi-multicloud-sdk

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: audit

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: 检索发布分发包
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        # 只下载构建产物，避免把历次 ci-evidence-pack 生成的 evidence-bundle 一并拉下来
        name: release-dists
        path: all-dists/

    - name: 合并分发包到 dist 目录并校验完整性
      run: |
        set -e
        mkdir -p dist
        # 仅拷贝 SDK 自身的 wheel 与 sdist，防止 evidence-bundle 等非发行文件混入 dist/
        # （否则 twine 会将其当作 sdist 校验并报 InvalidDistribution: 顶层成员过多）
        find all-dists -name "mzapi_multicloud_sdk-*.whl" -exec cp {} dist/ \;
        find all-dists -name "mzapi_multicloud_sdk-*.tar.gz" -exec cp {} dist/ \;

        # 校验 wheel（本质为 zip）完整性，确保未被并发覆盖/截断导致中央目录损坏
        echo "🔍 校验 dist/ 中 wheel 与 sdist 的完整性..."
        for whl in dist/*.whl; do
          [ -e "$whl" ] || continue
          python -m zipfile -t "$whl" && echo "✅ 校验通过: $whl"
        done
        for tgz in dist/*.tar.gz; do
          [ -e "$tgz" ] || continue
          tar -tzf "$tgz" >/dev/null && echo "✅ 校验通过: $tgz"
        done
        echo "--- dist/ 最终内容 ---"
        ls -la dist/

    - name: 提取版本号
      id: extract_version
      run: |
        set -e

        echo "🔍 开始从 pyproject.toml 提取版本号..."

        # 检查 pyproject.toml 是否存在
        if [ ! -f "pyproject.toml" ]; then
          echo "❌ 错误: pyproject.toml 文件不存在"
          echo "📁 当前目录内容:"
          ls -la
          exit 1
        fi

        # 使用 grep 从 pyproject.toml 提取版本号（兼容 version = "x" 与 version="x" 写法，剥离两侧引号）
        version=$(grep -E '^[[:space:]]*version[[:space:]]*=' pyproject.toml | head -1 | sed -E 's/.*=[[:space:]]*[\"'\'']?([^\"'\'']+)[\"'\'']?.*/\1/' | tr -d '[:space:]')

        # 验证是否成功提取版本号
        if [ -z "$version" ]; then
          echo "❌ 错误: 无法从 pyproject.toml 提取版本号"
          echo "📄 pyproject.toml 内容:"
          cat pyproject.toml
          exit 1
        fi

        # 验证版本号格式 (支持 x.y.z 或 x.y.z.a 格式)
        if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
          echo "❌ 错误: 提取的版本号格式无效: '$version'"
          echo "💡 版本号应为 x.y.z 或 x.y.z.a 格式"
          exit 1
        fi

        echo "✅ 成功提取版本号: $version"
        echo "version=$version" >> $GITHUB_ENV

    - name: 将发布分发包发布到PyPI
      uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1
      with:
        packages-dir: dist/
        verify-metadata: true
        skip-existing: true
        verbose: true
        print-hash: true

    - name: Generate CI Evidence Pack
      if: always()
      uses: OrygnsCode/ci-evidence-pack@8222d7b3b015ce2f72222215bdf9966773036ab1
      with:
        upload-name: evidence-bundle-v${{ env.version }}
        sign: 'true'
        include: |
          dist/
        retention-days: 90

    - name: Create GitHub release
      uses: step-security/action-gh-release@277bfa82abcfdb73e5bbb19e213fd76532ee2be5 # v3.0.0
      with:
          tag_name: v${{ env.version }}
          name: Release v${{ env.version }}
          body: |
            🎉 发布新版本${{ env.version }} 🎉

            这是我们新版本${{ env.version }}的发布说明。本次发布包含了以下更改：

            ${{ github.event.head_commit.message }}！
          files: |
            dist/*.whl
            dist/*.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
