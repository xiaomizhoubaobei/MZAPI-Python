name: 发布包到PyPI

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'

permissions:
  contents: read
  id-token: write

jobs:
  release-build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e3f713f2d8f53843e71c69a996d56f51aa9adfb9 # v2.14.1
      with:
        egress-policy: audit

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: 设置Python环境
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: 构建发布分发包
      run: |
        python -m pip install build
        python -m build

    - name: 上传分发包作为工件
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: release-dists-${{ matrix.os }}-${{ matrix.python-version }}
        path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs: release-build

    environment:
      name: pypi
      url: https://pypi.org/project/MZ-SDK

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e3f713f2d8f53843e71c69a996d56f51aa9adfb9 # v2.14.1
      with:
        egress-policy: audit

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: 检索所有发布分发包
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        path: all-dists/

    - name: 合并所有分发包到 dist 目录
      run: |
        mkdir -p dist
        find all-dists -name "*.whl" -exec cp {} dist/ \;
        find all-dists -name "*.tar.gz" -exec cp {} dist/ \;

    - name: 提取版本号
      id: extract_version
      run: |
        set -e
        
        echo "🔍 开始从 pyproject.toml 提取版本号..."
        
        # 检查 pyproject.toml 是否存在
        if [ ! -f "pyproject.toml" ]; then
          echo "❌ 错误: pyproject.toml 文件不存在"
          echo "📁 当前目录内容:"
          ls -la
          exit 1
        fi
        
        # 使用 grep 从 pyproject.toml 提取版本号
        version=$(grep -E '^version\s*=' pyproject.toml | head -1 | sed -E 's/.*version\s*=\s*["'\'']?([^"'\''"]+)["'\'']?.*/\1/')
        
        # 验证是否成功提取版本号
        if [ -z "$version" ]; then
          echo "❌ 错误: 无法从 pyproject.toml 提取版本号"
          echo "📄 pyproject.toml 内容:"
          cat pyproject.toml
          exit 1
        fi
        
        # 验证版本号格式 (支持 x.y.z 或 x.y.z.a 格式)
        if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
          echo "❌ 错误: 提取的版本号格式无效: '$version'"
          echo "💡 版本号应为 x.y.z 或 x.y.z.a 格式"
          exit 1
        fi
        
        echo "✅ 成功提取版本号: $version"
        echo "version=$version" >> $GITHUB_ENV

    - name: 将发布分发包发布到PyPI
      uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1
      with:
        packages-dir: dist/

    - name: Generate CI Evidence Pack
      if: always()
      uses: OrygnsCode/ci-evidence-pack@8222d7b3b015ce2f72222215bdf9966773036ab1
      with:
        upload-name: evidence-bundle-v${{ env.version }}
        sign: 'true'
        include: |
          dist/
        retention-days: 90

    - name: Create GitHub release
      uses: step-security/action-gh-release@d45511d7589f080cf54961ff056b9705a74fd160 # v2.5.0
      with:
          tag_name: v${{ env.version }}
          name: Release v${{ env.version }}
          body: |
            🎉 发布新版本${{ env.version }} 🎉

            这是我们新版本${{ env.version }}的发布说明。本次发布包含了以下更改：

            ${{ github.event.head_commit.message }}！
          files: |
            dist/*.whl
            dist/*.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}