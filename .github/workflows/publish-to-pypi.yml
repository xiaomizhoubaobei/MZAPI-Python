name: 发布包到PyPI

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: audit

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 2

    - name: 检查版本号是否变更
      id: check
      run: |
        set -e

        echo "🔍 检查 pyproject.toml 中版本号是否发生变更..."

        # 提取当前版本号（兼容 version = "x" 与 version="x" 两种写法，并剥离两侧引号）
        current_version=$(grep -E '^[[:space:]]*version[[:space:]]*=' pyproject.toml | head -1 | sed -E 's/.*=[[:space:]]*[\"'\'']?([^\"'\'']+)[\"'\'']?.*/\1/' | tr -d '[:space:]')
        echo "当前版本号: $current_version"

        # 提取上一次提交中的版本号（首次提交时 git show HEAD~1 会失败，此时 prev_version 为空）
        prev_version=$(git show HEAD~1:pyproject.toml 2>/dev/null | grep -E '^[[:space:]]*version[[:space:]]*=' | head -1 | sed -E 's/.*=[[:space:]]*[\"'\'']?([^\"'\'']+)[\"'\'']?.*/\1/' | tr -d '[:space:]') || true
        echo "上一次版本号: $prev_version"

        # 若未取到上一次版本号，视为未发生变更，避免误触发发布
        if [ -z "$prev_version" ] || [ "$current_version" = "$prev_version" ]; then
          echo "ℹ️ 版本号未变更（$current_version），跳过发布"
          echo "version_changed=false" >> $GITHUB_OUTPUT
        else
          echo "✅ 版本号已变更: $prev_version -> $current_version"
          echo "version_changed=true" >> $GITHUB_OUTPUT
          echo "version=$current_version" >> $GITHUB_OUTPUT
        fi

  release-build:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: audit

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: 设置Python环境
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: 构建发布分发包
      run: |
        python -m pip install build
        python -m build

    - name: 上传分发包作为工件
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: release-dists-${{ matrix.os }}-${{ matrix.python-version }}
        path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs: release-build

    environment:
      name: pypi
      url: https://pypi.org/project/mzapi

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: audit

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: 检索所有发布分发包
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        path: all-dists/

    - name: 合并所有分发包到 dist 目录
      run: |
        mkdir -p dist
        find all-dists -name "*.whl" -exec cp {} dist/ \;
        find all-dists -name "*.tar.gz" -exec cp {} dist/ \;

    - name: 提取版本号
      id: extract_version
      run: |
        set -e

        echo "🔍 开始从 pyproject.toml 提取版本号..."

        # 检查 pyproject.toml 是否存在
        if [ ! -f "pyproject.toml" ]; then
          echo "❌ 错误: pyproject.toml 文件不存在"
          echo "📁 当前目录内容:"
          ls -la
          exit 1
        fi

        # 使用 grep 从 pyproject.toml 提取版本号（兼容 version = "x" 与 version="x" 写法，剥离两侧引号）
        version=$(grep -E '^[[:space:]]*version[[:space:]]*=' pyproject.toml | head -1 | sed -E 's/.*=[[:space:]]*[\"'\'']?([^\"'\'']+)[\"'\'']?.*/\1/' | tr -d '[:space:]')

        # 验证是否成功提取版本号
        if [ -z "$version" ]; then
          echo "❌ 错误: 无法从 pyproject.toml 提取版本号"
          echo "📄 pyproject.toml 内容:"
          cat pyproject.toml
          exit 1
        fi

        # 验证版本号格式 (支持 x.y.z 或 x.y.z.a 格式)
        if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
          echo "❌ 错误: 提取的版本号格式无效: '$version'"
          echo "💡 版本号应为 x.y.z 或 x.y.z.a 格式"
          exit 1
        fi

        echo "✅ 成功提取版本号: $version"
        echo "version=$version" >> $GITHUB_ENV

    - name: 将发布分发包发布到PyPI
      uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1
      with:
        packages-dir: dist/
        verify-metadata: true
        skip-existing: true
        verbose: true
        print-hash: true

    - name: Generate CI Evidence Pack
      if: always()
      uses: OrygnsCode/ci-evidence-pack@8222d7b3b015ce2f72222215bdf9966773036ab1
      with:
        upload-name: evidence-bundle-v${{ env.version }}
        sign: 'true'
        include: |
          dist/
        retention-days: 90

    - name: Create GitHub release
      uses: step-security/action-gh-release@277bfa82abcfdb73e5bbb19e213fd76532ee2be5 # v3.0.0
      with:
          tag_name: v${{ env.version }}
          name: Release v${{ env.version }}
          body: |
            🎉 发布新版本${{ env.version }} 🎉

            这是我们新版本${{ env.version }}的发布说明。本次发布包含了以下更改：

            ${{ github.event.head_commit.message }}！
          files: |
            dist/*.whl
            dist/*.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
