# 此工作流警告并随后关闭在指定时间内没有活动的 Issues 和 PRs。
#
# 你可以通过修改此文件来调整行为。
# 更多信息请参阅：
# https://github.com/actions/stale
name: 标记陈旧问题和拉取请求

on:
  schedule:
  - cron: '44 17 * * *'

# Workflow 级别权限配置
permissions:
  contents: read  # 遵循最小权限原则

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write       # 需要更新 Issues
      pull-requests: write  # 需要更新 PRs
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          egress-policy: audit

      - name: 标记陈旧的 Issues 和 PRs
        uses: actions/stale@eb5cf3af3ac0a1aa4c9c45633dd1ae542a27a899 # v10.3.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: |
            👋 感谢您提交的 Issue！

            由于此 Issue 已超过 60 天没有活动，我将其标记为「陈旧」。

            如果您仍然遇到此问题或有新的信息要分享，请随时回复，我会重新激活它。

            ⚠️ 如果在 30 天内没有进一步活动，此 Issue 将被自动关闭。
          stale-pr-message: |
            👋 感谢您的贡献！

            由于此 Pull Request 已超过 60 天没有活动，我将其标记为「陈旧」。

            如果您仍然希望合并此 PR，请回复或更新代码，我会重新激活它。

            ⚠️ 如果在 30 天内没有进一步活动，此 PR 将被自动关闭。
          close-issue-message: |
            🔒 此 Issue 由于长时间未活动已被自动关闭。

            如果您仍然需要帮助或有新的信息，请随时创建新的 Issue 并引用此问题。
          close-pr-message: |
            🔒 此 Pull Request 由于长时间未活动已被自动关闭。

            如果您仍然希望合并此代码，请随时重新提交 PR。
          stale-issue-label: 'no-issue-activity'
          stale-pr-label: 'no-pr-activity'
          days-before-stale: 60
          days-before-close: 30
          days-before-pr-stale: 60
          days-before-pr-close: 30
