# Pre-commit 配置文件
# https://pre-commit.com

# 通用钩子
repos:
  # 🔒 密钥泄露检测 - 必须配置
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        args: [--staged, --redact]
        stages: [pre-commit]

  # 🐍 Python 代码检查 - 必须配置
  - repo: https://github.com/pycqa/pylint
    hooks:
      - id: pylint
        args: [--rcfile=.pylintrc, --fail-on=I]
        additional_dependencies:
          - pylint-pytest
        stages: [pre-commit]

  # 🔧 删除行尾空格 - 推荐
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--fix]
        stages: [pre-commit]

  # 📄 修复文件末尾 - 推荐
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        stages: [pre-commit]

  # 🐚 Shell 脚本检查 - 推荐
  - repo: https://github.com/shellcheck-py/shellcheck-py
    hooks:
      - id: shellcheck
        args: [--severity=warning]
        types: [shell]
        stages: [pre-commit]
