# =============================================================================
# AI 审计 Taskflow 测试示例 — Python 仓库
# =============================================================================
# 用途：对 CodeQL 静态扫描在本仓库（mzapi/**）产生的安全告警做 AI 分流。
# 框架：GitHubSecurityLab/seclab-taskflow-agent
# 说明：
#   - 本文件是一个"测试用示例"，用于验证 AI 审计链路能跑通（CodeQL 告警 -> 信息收集 -> 审计 -> 报告 -> 校验）。
#   - 它参照 GitHub Security Lab 文章中描述的 5 阶段分流流程编写。
#   - 请先阅读同目录下的 README.md 了解运行前提（LLM 配置、GitHub PAT、MCP Server）。
#
# 适配语言：Python
# 告警输入：由 .github/workflows/codeql.yml 扫描 mzapi/** 产生的 CodeQL 安全告警
# =============================================================================

workflow:
  name: "MZAPI Python AI 告警分流（测试示例）"
  description: >-
    对 mzapi/** 的 CodeQL 告警做 AI 分流，剔除误报并生成带引用的漏洞报告。
  # 针对 CodeQL 告警列表逐条套用同一套模板（对应文章的 repeat_prompt 批量循环）
  repeat_prompt: "{{alert}}"

  # 1) 信息收集：调 GitHub API / MCP Server 拿告警上下文（触发点、调用链、权限）
  - task: "info_collection"
    name: "收集告警上下文"
    prompt: >-
      你是一名安全审计员。请针对以下 CodeQL 安全告警，调用 MCP Server 的
      GitHub API 收集信息：
      - 告警的 source（来源点）与 sink（汇点）在文件中的精确行号；
      - 告警路径上是否有用户输入（不可信数据）流入；
      - 该代码路径是否在特权/高权限上下文（如管理员、root、凭证处理）中执行；
      - 该告警触发的输入是否真的可被外部攻击者控制。
      输出请使用 JSON，并严格给出"文件名:行号"引用，不得编造。

  # 2) 审计：剔除误报（攻击者能否触发？是否特权上下文？）
  - task: "triage"
    name: "审计剔除误报"
    depends_on: ["info_collection"]
    prompt: >-
      基于上一步收集的信息，判定该告警是否为真实漏洞（而非误报）：
      - 若攻击者无法触发该代码路径，或输入不可控，则标记为误报(FP)；
      - 若在特权上下文执行且输入可控，则视为潜在漏洞(TP)。
      对每个判定给出 2-3 条简短理由。

  # 3) 生成漏洞报告（带精确文件+行号引用）
  - task: "report"
    name: "生成漏洞报告"
    depends_on: ["triage"]
    prompt: >-
      仅对判定为 TP 的告警生成漏洞报告。报告必须包含：
      - 漏洞类型、严重程度；
      - 精确的 source 与 sink 位置（文件+行号）；
      - 攻击路径描述；
      - 修复建议。
      若全部为误报，则输出 "NO_VULNERABILITY"。

  # 4) 校验：报告不完整/不一致=幻觉，直接驳回
  - task: "validate"
    name: "报告校验（防幻觉）"
    depends_on: ["report"]
    prompt: >-
      校验上一步生成的漏洞报告：
      - 报告中的文件/行号是否与告警上下文一致？
      - 是否缺少关键字段（漏洞类型/位置/攻击路径）？
      - 若信息缺失或不一致，判定为幻觉并驳回（输出 REJECTED），不创建 Issue。
      通过后输出 APPROVED。

  # 5) 知识回流：人工驳回原因回流给 LLM，持续改进（测试示例中仅记录，不实际创建 Issue）
  - task: "feedback"
    name: "知识回流（预留）"
    depends_on: ["validate"]
    prompt: >-
      将人工审查时产生的"驳回原因/误报标签"记录到本地知识文件，供后续
      同类告警的审计参考，形成持续改进闭环。本测试示例只输出记录结果，不创建 Issue。
