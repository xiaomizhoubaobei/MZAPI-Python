[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mzapi"
version = "0.0.1"
authors = [
    {name = "祁潇潇", email = "qixiaoxin@stu.sqxy.edu.cn"}
]
description = "MZAPI - 集成多家云服务商 API 的多云统一接口库 (Python SDK)"
readme = "README.md"
license = {text = "MPL-2.0"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["API", "SDK", "MZAPI", "PYTHON", "MULTICLOUD", "ALIYUN", "TENCENTCLOUD", "HUAWEICLOUD", "OCR"]
dependencies = [
    "requests>=2.33.0",
    "pytz~=2026.1",
    "simplejson>=3.20.0",
    "alibabacloud-credentials>=1.0.0",
    "alibabacloud-gateway-spi>=0.0.3",
    "alibabacloud-tea>=0.4.0",
    "darabonba-core>=1.0.0",
    "cryptography>=46.0.7",
]

[project.optional-dependencies]
dev = [
    "black>=21.0",
    "flake8>=3.8",
]

[project.urls]
"Bug Reports" = "https://github.com/xiaomizhoubaobei/MZAPI-Python/issues"
"Source" = "https://github.com/xiaomizhoubaobei/MZAPI-Python"
"Homepage" = "https://pypi.org/project/mzapi"
"Download" = "https://pypi.org/project/mzapi/#files"
"Changelog" = "https://github.com/xiaomizhoubaobei/MZAPI-Python/CHANGELOG.md"
"Documentation" = "https://docs.mizhoubaobei.top"
"GitHub" = "https://github.com/xiaomizhoubaobei/MZAPI-Python"

[tool.setuptools.packages.find]
where = ["."]
include = ["mzapi*"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312', 'py313', 'py314']
